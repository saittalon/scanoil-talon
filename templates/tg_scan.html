<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Сканер талонов</title>
  <style>
    html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow:hidden}
    #reader{position:fixed;inset:0;z-index:1}
    .overlay{position:fixed;inset:0;pointer-events:none;z-index:2;display:flex;align-items:center;justify-content:center}
    .frame{width:min(78vw,78vh);height:min(78vw,78vh);border:4px solid rgba(255,255,255,.95);border-radius:20px;box-shadow:0 0 0 9999px rgba(0,0,0,.45)}
    .status{position:fixed;left:12px;right:12px;top:12px;z-index:3;background:rgba(9,20,50,.92);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:18px 20px;font-size:20px;line-height:1.35;box-shadow:0 12px 30px rgba(0,0,0,.25)}
    .flash{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;font-size:190px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .15s ease}
    .flash.show{opacity:1}.flash.ok{background:rgba(24,160,84,.94)}.flash.err{background:rgba(210,44,44,.94)}
  </style>
</head>
<body>
  <div id="reader"></div>
  <div class="overlay"><div class="frame"></div></div>
  <div id="status" class="status">⏳ Ожидание запуска сканера…</div>
  <div id="flash" class="flash"></div>
  <audio id="okAudio" preload="auto" src="/static/scan.wav"></audio>
  <audio id="errAudio" preload="auto" src="/static/error.wav"></audio>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/html5-qrcode/html5-qrcode.min.js"></script>
  <script>
    const TOKEN = {{ token|tojson }};
    const tg = window.Telegram && Telegram.WebApp ? Telegram.WebApp : null;
    const initData = tg && tg.initData ? tg.initData : '';
    const statusEl = document.getElementById('status');
    const flashEl = document.getElementById('flash');
    const okAudio = document.getElementById('okAudio');
    const errAudio = document.getElementById('errAudio');
    let scanner = null;
    let busy = false;
    let lastCode = '';
    let lastAt = 0;

    function setStatus(t){ statusEl.textContent = t; }
    function beep(type){
      const a = type === 'ok' ? okAudio : errAudio;
      try{ a.pause(); a.currentTime = 0; a.play().catch(()=>{}); }catch(e){}
      try{
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator(); const g = ctx.createGain();
        o.type='sine'; o.frequency.value = type === 'ok' ? 1100 : 240;
        g.gain.value = 0.07; o.connect(g); g.connect(ctx.destination); o.start();
        setTimeout(()=>{o.stop(); ctx.close();}, type === 'ok' ? 180 : 350);
      }catch(e){}
      try{ if(tg && tg.HapticFeedback){ tg.HapticFeedback.notificationOccurred(type === 'ok' ? 'success' : 'error'); } }catch(e){}
    }
    function flash(type){
      flashEl.className = 'flash show ' + (type === 'ok' ? 'ok' : 'err');
      flashEl.textContent = type === 'ok' ? '✓' : '✕';
    }
    function closeLater(){ setTimeout(()=>{ try{ if(tg){ tg.close(); } else { window.close(); } }catch(e){} }, 1300); }

    async function submitCode(raw){
      if(busy) return;
      const code = String(raw || '').trim().match(/(\d{6,})/);
      const normalized = code ? code[1] : String(raw || '').trim();
      const now = Date.now();
      if(!normalized) return;
      if(normalized === lastCode && now - lastAt < 2500) return;
      lastCode = normalized; lastAt = now; busy = true;
      setStatus('⏳ Проверяю талон…');
      try{
        const res = await fetch('/tg/api/scan', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ token: TOKEN, code: normalized, initData })
        });
        const data = await res.json().catch(()=>({ok:false,error:'bad_json'}));
        if(res.ok && data.ok){
          setStatus(`✅ Талон принят: №${data.serial || '—'} / ${data.liters || 0} л`);
          beep('ok'); flash('ok');
          try{ await scanner.stop(); }catch(e){}
          closeLater();
          return;
        }
        let msg = '❌ Ошибка талона';
        if(data.error === 'already_used') msg = '❌ Талон уже использован';
        else if(data.error === 'expired') msg = '❌ Срок действия истёк';
        else if(data.error === 'talon_not_found') msg = '❌ Талон не найден';
        else if(data.error === 'invalid_telegram_context' || data.error === 'token_expired' || data.error === 'not_logged_in') msg = '❌ Сессия истекла. Откройте сканер заново';
        setStatus(msg);
        beep('err'); flash('err');
        try{ await scanner.stop(); }catch(e){}
        closeLater();
      }catch(e){
        setStatus('❌ Ошибка сети');
        beep('err'); flash('err');
        try{ await scanner.stop(); }catch(e2){}
        closeLater();
      }
      finally{ busy = false; }
    }

    async function start(){
      try{
        if(tg){ tg.ready(); tg.expand(); }
        document.body.addEventListener('click', ()=>{ try{ okAudio.play().then(()=>{okAudio.pause();okAudio.currentTime=0;}); errAudio.play().then(()=>{errAudio.pause();errAudio.currentTime=0;}); }catch(e){} }, {once:true});
        scanner = new Html5Qrcode('reader');
        setStatus('📷 Наведите камеру на QR талона');
        await scanner.start(
          { facingMode: 'environment' },
          { fps: 12, qrbox: { width: 280, height: 280 }, aspectRatio: 1.0 },
          decodedText => submitCode(decodedText),
          () => {}
        );
      }catch(e){
        setStatus('❌ Не удалось открыть камеру');
      }
    }
    start();
  </script>
</body>
</html>
