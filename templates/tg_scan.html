<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Сканер талонов</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow: hidden;
    }

    #app {
      position: fixed;
      inset: 0;
      background: #000;
    }

    #video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    .topbar {
      position: fixed;
      left: 12px;
      right: 12px;
      top: 12px;
      z-index: 10;
      padding: 14px 18px;
      border-radius: 22px;
      background: rgba(9, 22, 67, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 18px;
      font-weight: 700;
      backdrop-filter: blur(10px);
    }

    .frame {
      position: fixed;
      left: 50%;
      top: 50%;
      width: min(72vw, 320px);
      height: min(72vw, 320px);
      transform: translate(-50%, -42%);
      border: 6px solid rgba(255, 255, 255, 0.96);
      border-radius: 28px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.34);
      z-index: 8;
      pointer-events: none;
    }

    .result {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease;
    }

    .result.show {
      opacity: 1;
    }

    .result.ok {
      background: rgba(19, 153, 81, 0.92);
    }

    .result.error {
      background: rgba(190, 37, 37, 0.92);
    }

    .icon {
      font-size: 180px;
      line-height: 1;
      margin-bottom: 18px;
    }

    .text {
      font-size: 26px;
      font-weight: 800;
      text-align: center;
      padding: 0 24px;
    }

    .sub {
      font-size: 17px;
      margin-top: 10px;
      text-align: center;
      padding: 0 24px;
      opacity: 0.95;
      max-width: 720px;
      white-space: pre-line;
    }

    canvas {
      display: none;
    }

    #tapUnlock {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: transparent;
    }
  </style>
</head>
<body>
  <div id="app">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>

    <div id="status" class="topbar">📷 Наведите камеру на QR талона</div>
    <div class="frame"></div>

    <div id="result" class="result">
      <div id="resultIcon" class="icon">✓</div>
      <div id="resultText" class="text"></div>
      <div id="resultSub" class="sub"></div>
    </div>

    <div id="tapUnlock"></div>
  </div>

  <!-- УСПЕХ -->
  <audio id="okAudio" preload="auto">
    <source src="{{ url_for('static', filename='success.wav') }}" type="audio/wav">
  </audio>

  <!-- ОШИБКА -->
  <audio id="errAudio" preload="auto">
    <source src="{{ url_for('static', filename='error.wav') }}" type="audio/wav">
  </audio>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    const TOKEN = {{ token|tojson }};
    const tg = window.Telegram && Telegram.WebApp ? Telegram.WebApp : null;
    const INIT_DATA = tg && tg.initData ? tg.initData : "";

    const video = document.getElementById("video");
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");
    const resultIconEl = document.getElementById("resultIcon");
    const resultTextEl = document.getElementById("resultText");
    const resultSubEl = document.getElementById("resultSub");
    const okAudio = document.getElementById("okAudio");
    const errAudio = document.getElementById("errAudio");
    const tapUnlock = document.getElementById("tapUnlock");

    let stream = null;
    let detector = null;
    let active = true;
    let busy = false;
    let lastCode = "";
    let lastAt = 0;
    let audioUnlocked = false;

    if (tg) {
      tg.ready();
      try { tg.expand(); } catch (e) {}
      try { tg.disableVerticalSwipes(); } catch (e) {}
      try { tg.BackButton.hide(); } catch (e) {}
    }

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function vibrate(kind) {
      try {
        if (tg && tg.HapticFeedback) {
          if (kind === "ok") tg.HapticFeedback.notificationOccurred("success");
          else tg.HapticFeedback.notificationOccurred("error");
        }
      } catch (e) {}

      try {
        if (navigator.vibrate) {
          navigator.vibrate(kind === "ok" ? [120, 50, 120] : [220, 80, 220]);
        }
      } catch (e) {}
    }

    async function unlockAudio() {
      if (audioUnlocked) return true;

      try {
        okAudio.muted = false;
        errAudio.muted = false;
        okAudio.volume = 1;
        errAudio.volume = 1;

        okAudio.load();
        errAudio.load();

        audioUnlocked = true;
        return true;
      } catch (e) {
        return false;
      }
    }

    function playAudio(el) {
      try {
        el.pause();
        el.currentTime = 0;
        el.muted = false;
        el.volume = 1;

        const p = el.play();
        if (p && typeof p.catch === "function") {
          p.catch(() => {});
        }
      } catch (e) {}
    }

    function playOk() {
      vibrate("ok");
      playAudio(okAudio);
    }

    function playErr() {
      vibrate("error");
      playAudio(errAudio);
    }

    function showResult(kind, text, sub = "") {
      active = false;

      try {
        if (stream) stream.getTracks().forEach(t => t.stop());
      } catch (e) {}

      resultEl.className = `result show ${kind === "ok" ? "ok" : "error"}`;
      resultIconEl.textContent = kind === "ok" ? "✓" : "✕";
      resultTextEl.textContent = text;
      resultSubEl.textContent = sub || "";

      if (kind === "ok") {
        playOk();
      } else {
        playErr();
      }

      setTimeout(() => {
        try {
          if (tg) tg.close();
          else window.close();
        } catch (e) {}
      }, 2500);
    }

    function normalizeCode(raw) {
      let code = String(raw || "").trim();

      try {
        const u = new URL(code);
        code =
          u.searchParams.get("code") ||
          u.searchParams.get("talon") ||
          u.searchParams.get("id") ||
          code;
      } catch (e) {}

      const m = code.match(/(\d{6,})/);
      return m ? m[1] : code;
    }

    function fmtDate(s) {
      if (!s) return "—";
      const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
      return m ? `${m[3]}.${m[2]}.${m[1]}` : s;
    }

    async function submitCode(rawCode) {
      const code = normalizeCode(rawCode);
      if (!code) return;

      busy = true;
      setStatus("⏳ Проверяю талон...");

      try {
        const res = await fetch("/tg/api/scan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            token: TOKEN,
            code,
            initData: INIT_DATA
          })
        });

        const data = await res.json().catch(() => ({ ok: false, error: "bad_json" }));

        if (res.ok && data.ok) {
          const sub =
            (data.used_at_text || "") +
            (data.agzs ? "\nАГЗС: " + data.agzs : "");

          showResult("ok", `Талон №${data.serial || code} принят`, sub);
          return;
        }

        if (data.error === "already_used") {
          const sub =
            (data.used_at_text || "") +
            (data.agzs ? "\nАГЗС: " + data.agzs : "");

          showResult("error", `Талон №${data.serial || code} уже использован`, sub);
          return;
        }

        if (data.error === "expired") {
          showResult(
            "error",
            "Срок действия талона истёк",
            `Срок действия: ${fmtDate(data.valid_from)} — ${fmtDate(data.valid_to)}`
          );
          return;
        }

        if (data.error === "talon_not_found") {
          showResult("error", `Талон ${code} не найден`);
          return;
        }

        if (data.error === "token_expired" || data.error === "not_logged_in") {
          showResult("error", "Сессия истекла", "Откройте сканер заново из Telegram");
          return;
        }

        showResult("error", "Ошибка проверки талона");
      } catch (e) {
        showResult("error", "Ошибка сети");
      }
    }

    async function scanOnce() {
      if (!active || busy || !detector || video.readyState < 2) return;

      try {
        const codes = await detector.detect(video);

        if (codes && codes.length) {
          const code = normalizeCode(codes[0].rawValue || "");
          const now = Date.now();

          if (code && (code !== lastCode || now - lastAt > 2500)) {
            lastCode = code;
            lastAt = now;
            await submitCode(code);
            return;
          }
        }
      } catch (e) {}

      if (active && !busy) {
        setTimeout(scanOnce, 180);
      }
    }

    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" }
          },
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        if (!("BarcodeDetector" in window)) {
          showResult("error", "Сканер не поддерживается", "Откройте WebApp на другом устройстве");
          return;
        }

        detector = new BarcodeDetector({ formats: ["qr_code"] });
        setStatus("📷 Наведите камеру на QR талона");
        setTimeout(scanOnce, 250);
      } catch (e) {
        showResult("error", "Не удалось открыть камеру");
      }
    }

    async function firstGestureInit() {
      try {
        await unlockAudio();
      } catch (e) {}

      try {
        tapUnlock.style.display = "none";
      } catch (e) {}
    }

    tapUnlock.addEventListener("touchstart", firstGestureInit, { once: true });
    tapUnlock.addEventListener("touchend", firstGestureInit, { once: true });
    tapUnlock.addEventListener("click", firstGestureInit, { once: true });

    window.addEventListener("load", async () => {
      startCamera();
    });

    window.addEventListener("beforeunload", () => {
      active = false;
      try {
        if (stream) stream.getTracks().forEach(t => t.stop());
      } catch (e) {}
    });
  </script>
</body>
</html>
