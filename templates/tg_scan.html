<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Сканер талонов</title>
  <style>
    html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow:hidden}
    #app{position:fixed;inset:0;background:#000}
    #video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
    .topbar{position:fixed;left:12px;right:12px;top:12px;z-index:5;padding:14px 18px;border-radius:22px;background:rgba(9,22,67,.88);border:1px solid rgba(255,255,255,.12);font-size:18px;font-weight:700;backdrop-filter:blur(10px)}
    .hint{position:fixed;left:14px;right:14px;bottom:18px;z-index:5;padding:12px 16px;border-radius:18px;background:rgba(9,22,67,.78);border:1px solid rgba(255,255,255,.1);font-size:15px;line-height:1.35}
    .result{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:20;opacity:0;pointer-events:none;transition:opacity .18s ease}
    .result.show{opacity:1}
    .result.ok{background:rgba(19,153,81,.92)}
    .result.error{background:rgba(190,37,37,.92)}
    .icon{font-size:180px;line-height:1;margin-bottom:18px}
    .text{font-size:26px;font-weight:800;text-align:center;padding:0 24px}
    .sub{font-size:17px;margin-top:10px;text-align:center;padding:0 24px;opacity:.95;max-width:720px}
    canvas{display:none}
  </style>
</head>
<body>
<div id="app">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>
  <div id="status" class="topbar">📷 Наведите камеру на QR талона</div>
  <div class="hint">Сканер запускается автоматически. После проверки появится галочка или крест, затем WebApp сам закроется.</div>
  <div id="result" class="result">
    <div id="resultIcon" class="icon">✓</div>
    <div id="resultText" class="text"></div>
    <div id="resultSub" class="sub"></div>
  </div>
</div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
const TOKEN = {{ token|tojson }};
const tg = window.Telegram && Telegram.WebApp ? Telegram.WebApp : null;
const INIT_DATA = tg && tg.initData ? tg.initData : "";
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');
const resultIconEl = document.getElementById('resultIcon');
const resultTextEl = document.getElementById('resultText');
const resultSubEl = document.getElementById('resultSub');
let stream = null;
let detector = null;
let active = true;
let busy = false;
let lastCode = '';
let lastAt = 0;
let audioCtx = null;

if (tg) {
  tg.ready();
  try { tg.expand(); } catch(e) {}
  try { tg.disableVerticalSwipes(); } catch(e) {}
}

function setStatus(text){ statusEl.textContent = text; }

function ensureAudio(){
  if (!audioCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (Ctx) audioCtx = new Ctx();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function beep(freq, duration){
  try {
    ensureAudio();
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.value = 0.001;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    gain.gain.exponentialRampToValueAtTime(0.18, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.start(now);
    osc.stop(now + duration + 0.02);
  } catch(e) {}
}

function playOk(){ beep(1046, 0.16); setTimeout(() => beep(1318, 0.18), 120); }
function playErr(){ beep(220, 0.18); setTimeout(() => beep(160, 0.24), 150); }

function showResult(kind, text, sub=''){
  if (kind === 'ok') {
    resultEl.className = 'result show ok';
    resultIconEl.textContent = '✓';
    playOk();
  } else {
    resultEl.className = 'result show error';
    resultIconEl.textContent = '✕';
    playErr();
  }
  resultTextEl.textContent = text;
  resultSubEl.textContent = sub || '';
  setTimeout(() => { try { if (tg) tg.close(); else window.close(); } catch(e) {} }, 1400);
}

function normalizeCode(raw){
  let code = String(raw || '').trim();
  try {
    const u = new URL(code);
    code = u.searchParams.get('code') || u.searchParams.get('talon') || u.searchParams.get('id') || code;
  } catch(e) {}
  const m = code.match(/(\d{6,})/);
  return m ? m[1] : code;
}

async function submitCode(rawCode){
  const code = normalizeCode(rawCode);
  if (!code) return;
  busy = true;
  setStatus('⏳ Проверяю талон...');
  try {
    const res = await fetch('/tg/api/scan', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ token: TOKEN, code, initData: INIT_DATA })
    });
    const data = await res.json().catch(() => ({ok:false,error:'bad_json'}));

    if (res.ok && data.ok) {
      showResult('ok', `Талон №${data.serial || code} принят`, `${data.used_at_text || ''}${data.agzs ? ' • ' + data.agzs : ''}`);
      return;
    }
    if (data.error === 'already_used') {
      showResult('error', `Талон №${data.serial || code} уже использован`, `${data.used_at_text || ''}${data.agzs ? ' • ' + data.agzs : ''}`);
      return;
    }
    if (data.error === 'expired') {
      let sub = '';
      if (data.valid_from || data.valid_to) sub = `Срок действия: ${data.valid_from || '—'} — ${data.valid_to || '—'}`;
      showResult('error', `Срок действия талона истёк`, sub);
      return;
    }
    if (data.error === 'talon_not_found') {
      showResult('error', `Талон ${code} не найден`);
      return;
    }
    if (data.error === 'token_expired' || data.error === 'not_logged_in' || data.error === 'invalid_telegram_context') {
      showResult('error', 'Сессия истекла', 'Откройте сканер заново из Telegram');
      return;
    }
    showResult('error', 'Ошибка проверки талона');
  } catch (e) {
    showResult('error', 'Ошибка сети');
  }
}

async function scanOnce(){
  if (!active || busy || !detector || video.readyState < 2) return;
  try {
    const codes = await detector.detect(video);
    if (codes && codes.length) {
      const code = normalizeCode(codes[0].rawValue || '');
      const now = Date.now();
      if (code && (code !== lastCode || now - lastAt > 2500)) {
        lastCode = code;
        lastAt = now;
        await submitCode(code);
      }
    }
  } catch (e) {}
  if (active && !busy) setTimeout(scanOnce, 250);
}

async function start(){
  try {
    ensureAudio();
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio:false });
    video.srcObject = stream;
    await video.play();
    if (!('BarcodeDetector' in window)) {
      setStatus('⚠️ На этом устройстве сканер не поддерживается');
      showResult('error', 'Сканер не поддерживается', 'Откройте WebApp на другом устройстве');
      return;
    }
    detector = new BarcodeDetector({ formats:['qr_code'] });
    setStatus('📷 Наведите камеру на QR талона');
    scanOnce();
  } catch (e) {
    setStatus('❌ Не удалось запустить камеру');
    showResult('error', 'Не удалось открыть камеру');
  }
}

document.addEventListener('click', ensureAudio, { once:true });
document.addEventListener('touchstart', ensureAudio, { once:true });
window.addEventListener('load', start);
window.addEventListener('beforeunload', () => {
  active = false;
  try { if (stream) stream.getTracks().forEach(t => t.stop()); } catch(e) {}
});
</script>
</body>
</html>
