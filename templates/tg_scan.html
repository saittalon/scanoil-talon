<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Сканер талонов</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow:hidden}
    .screen{position:fixed;inset:0;background:#000}
    #reader,#videoWrap{position:absolute;inset:0}
    #reader video{width:100%!important;height:100%!important;object-fit:cover!important}
    .frame{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:3}
    .box{width:min(74vw,74vh);height:min(74vw,74vh);border:4px solid rgba(255,255,255,.95);border-radius:22px;box-shadow:0 0 0 9999px rgba(0,0,0,.28)}
    .hint{position:absolute;left:0;right:0;bottom:26px;text-align:center;font-size:18px;font-weight:700;text-shadow:0 2px 10px rgba(0,0,0,.7);padding:0 20px;z-index:3}
    .status{position:absolute;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 16px);padding:14px 16px;border-radius:18px;background:rgba(17,28,48,.88);backdrop-filter:blur(10px);font-size:17px;z-index:4;text-align:center}
    .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;opacity:0;pointer-events:none;transition:opacity .15s ease}
    .overlay.show{opacity:1}
    .overlay.ok{background:rgba(24,160,76,.94)}
    .overlay.error{background:rgba(200,34,34,.94)}
    .icon{font-size:min(42vw,220px);font-weight:900;line-height:1;color:#fff;text-shadow:0 10px 30px rgba(0,0,0,.25)}
  </style>
</head>
<body>
<div class="screen">
  <div id="reader"></div>
  <div class="frame"><div class="box"></div></div>
  <div id="status" class="status">Открываю камеру…</div>
  <div class="hint">Наведите камеру на QR-код талона</div>
</div>
<div id="overlay" class="overlay"><div id="icon" class="icon"></div></div>
<script src="https://unpkg.com/html5-qrcode/html5-qrcode.min.js"></script>
<script>
const TOKEN = {{ token|tojson }};
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if(tg){ try{ tg.ready(); tg.expand(); }catch(e){} }
const INIT_DATA = tg && tg.initData ? tg.initData : "";
const statusEl = document.getElementById('status');
const overlay = document.getElementById('overlay');
const iconEl = document.getElementById('icon');
let scanner = null;
let inFlight = false;
let closed = false;
let audioCtx = null;
let lastCode = '';
let lastCodeAt = 0;

function setStatus(text){ statusEl.textContent = text; }
function vibrate(type){ try{ navigator.vibrate && navigator.vibrate(type==='ok' ? [60] : [120,60,120]); }catch(e){} }
function haptic(type){ try{ if(tg && tg.HapticFeedback){ tg.HapticFeedback.notificationOccurred(type === 'ok' ? 'success' : 'error'); } }catch(e){} }
function ensureAudio(){ try{ if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if(audioCtx.state === 'suspended') audioCtx.resume(); }catch(e){} }
function beep(type){
  try{
    ensureAudio();
    if(!audioCtx) return;
    const now = audioCtx.currentTime;
    const plan = type === 'ok' ? [880,1174] : [220,180];
    plan.forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, now + i*0.11);
      gain.gain.exponentialRampToValueAtTime(0.2, now + i*0.11 + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + i*0.11 + 0.10);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now + i*0.11); osc.stop(now + i*0.11 + 0.11);
    });
  }catch(e){}
}
function showOverlay(type){ overlay.className = 'overlay show ' + type; iconEl.textContent = type === 'ok' ? '✓' : '✕'; }
function hideOverlay(){ overlay.className = 'overlay'; }
function sendToBot(payload){ try{ if(tg){ tg.sendData(JSON.stringify(payload)); } }catch(e){} }
async function finish(type, payload){
  if(closed) return;
  closed = true;
  showOverlay(type);
  beep(type);
  vibrate(type);
  haptic(type);
  sendToBot(payload);
  try{ if(scanner){ await scanner.stop(); await scanner.clear(); scanner = null; } }catch(e){}
  setTimeout(() => { try{ tg && tg.close(); }catch(e){} }, 1200);
}
function normalizeCode(raw){
  let code = String(raw || '').trim();
  try{ const u = new URL(code); code = u.searchParams.get('code') || u.searchParams.get('talon') || u.searchParams.get('id') || code; }catch(e){}
  const m = code.match(/(\d{6,})/); return m ? m[1] : code;
}
function formatNow(){
  try{ return new Date().toLocaleString('ru-RU', { hour12:false }); }catch(e){ return ''; }
}
async function submitCode(raw){
  const code = normalizeCode(raw);
  if(!code || inFlight || closed) return;
  const now = Date.now();
  if(code === lastCode && now - lastCodeAt < 2500) return;
  lastCode = code; lastCodeAt = now; inFlight = true;
  setStatus('Проверяю талон…');
  try{
    const res = await fetch('/tg/api/scan', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ token: TOKEN, code, initData: INIT_DATA })
    });
    const data = await res.json().catch(() => ({ok:false,error:'bad_json'}));
    if(res.ok && data.ok){
      await finish('ok', { kind:'accepted', code, serial:data.serial || '', liters:data.liters || '', product:data.product || '', agzs:data.agzs || '', time:formatNow() });
      return;
    }
    if(data.error === 'already_used'){
      await finish('error', { kind:'already_used', code, agzs:data.agzs || '', used_at:data.used_at || '' });
      return;
    }
    if(data.error === 'expired'){
      await finish('error', { kind:'expired', code, valid_to:data.valid_to || '' });
      return;
    }
    if(data.error === 'talon_not_found'){
      await finish('error', { kind:'not_found', code });
      return;
    }
    await finish('error', { kind:'error', code });
  }catch(e){
    await finish('error', { kind:'error', code });
  } finally { inFlight = false; }
}
async function start(){
  ensureAudio();
  setStatus('Открываю камеру…');
  scanner = new Html5Qrcode('reader');
  await scanner.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: { width: 260, height: 260 }, aspectRatio: 1.7778 },
    decodedText => submitCode(decodedText),
    () => {}
  );
  setStatus('Наведите камеру на QR-код талона');
}
document.addEventListener('click', ensureAudio, {passive:true});
document.addEventListener('touchstart', ensureAudio, {passive:true});
window.addEventListener('load', () => start().catch(() => setStatus('Не удалось открыть камеру. Проверьте доступ к камере и откройте сканер снова.')));
</script>
</body>
</html>
