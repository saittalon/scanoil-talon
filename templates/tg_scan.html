<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Сканер талонов</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    #app, #video { position: fixed; inset: 0; }
    #app { background: #000; }
    #video {
      width: 100%; height: 100%; object-fit: cover; background: #000;
    }
    .topbar {
      position: fixed; left: 12px; right: 12px; top: max(12px, env(safe-area-inset-top));
      z-index: 10; padding: 14px 18px; border-radius: 22px;
      background: rgba(9,22,67,.88); border: 1px solid rgba(255,255,255,.12);
      font-size: 18px; font-weight: 700; backdrop-filter: blur(10px);
    }
    .frame {
      position: fixed; left: 50%; top: 50%; width: min(72vw, 320px); height: min(72vw, 320px);
      transform: translate(-50%, -42%); border: 6px solid rgba(255,255,255,.96); border-radius: 28px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,.34); z-index: 8; pointer-events: none;
    }
    .result {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; z-index: 20; opacity: 0; pointer-events: none; transition: opacity .18s ease;
    }
    .result.show { opacity: 1; pointer-events: auto; }
    .result.ok { background: rgba(19,153,81,.92); }
    .result.error { background: rgba(190,37,37,.92); }
    .icon { font-size: 180px; line-height: 1; margin-bottom: 18px; }
    .text { font-size: 26px; font-weight: 800; text-align: center; padding: 0 24px; }
    .sub {
      font-size: 17px; margin-top: 10px; text-align: center; padding: 0 24px;
      opacity: .95; max-width: 720px; white-space: pre-line;
    }
    .retry-btn {
      margin-top: 18px; border: 0; border-radius: 14px; padding: 12px 18px;
      font-size: 16px; font-weight: 800; background: rgba(255,255,255,.95); color: #08102a; display: none;
    }
    .result.show .retry-btn { display: inline-block; }
    .unlock {
      position: fixed; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 30; padding: 12px 14px; border-radius: 16px; background: rgba(0,0,0,.72);
      border: 1px solid rgba(255,255,255,.12); display: none; align-items: center; gap: 10px;
    }
    .unlock.show { display: flex; }
    .unlock button {
      border: 0; border-radius: 12px; padding: 10px 14px; font-weight: 800;
      background: #fff; color: #08102a;
    }
    canvas { display:none; }
  </style>
</head>
<body>
  <div id="app">
    <video id="video" playsinline webkit-playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>

    <div id="status" class="topbar">📷 Наведите камеру на QR талона</div>
    <div class="frame"></div>

    <div id="result" class="result">
      <div id="resultIcon" class="icon">✓</div>
      <div id="resultText" class="text"></div>
      <div id="resultSub" class="sub"></div>
      <button id="retryBtn" class="retry-btn" type="button">Повторить</button>
    </div>

    <div id="unlockBox" class="unlock">
      <div style="flex:1">Нажмите один раз, чтобы включить звук</div>
      <button id="unlockBtn" type="button">Включить звук</button>
    </div>
  </div>

  <audio id="okAudio" preload="auto" playsinline webkit-playsinline src="{{ url_for('static', filename='scan.wav') }}"></audio>
  <audio id="errAudio" preload="auto" playsinline webkit-playsinline src="{{ url_for('static', filename='error.wav') }}"></audio>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script>
    const TOKEN = {{ token|tojson }};
    const tg = window.Telegram && Telegram.WebApp ? Telegram.WebApp : null;
    const INIT_DATA = tg && tg.initData ? tg.initData : "";

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");
    const resultIconEl = document.getElementById("resultIcon");
    const resultTextEl = document.getElementById("resultText");
    const resultSubEl = document.getElementById("resultSub");
    const okAudio = document.getElementById("okAudio");
    const errAudio = document.getElementById("errAudio");
    const retryBtn = document.getElementById("retryBtn");
    const unlockBox = document.getElementById("unlockBox");
    const unlockBtn = document.getElementById("unlockBtn");

    const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    let stream = null;
    let detector = null;
    let scanTimer = null;
    let monitorTimer = null;
    let busy = false;
    let active = false;
    let lastCode = "";
    let lastAt = 0;
    let cameraStartPromise = null;
    let audioCtx = null;
    let audioUnlocked = false;
    let audioWarned = false;
    let closing = false;
    let pageVisible = document.visibilityState === "visible";
    let lastVideoTickAt = 0;
    let lastVideoTime = 0;

    if (tg) {
      tg.ready();
      try { tg.expand(); } catch (e) {}
      try { tg.disableVerticalSwipes(); } catch (e) {}
      try { tg.BackButton.hide(); } catch (e) {}
    }

    function setStatus(text) { statusEl.textContent = text; }

    function clearTimers() {
      if (scanTimer) clearTimeout(scanTimer);
      if (monitorTimer) clearInterval(monitorTimer);
      scanTimer = null;
      monitorTimer = null;
    }

    function stopStream(full = true) {
      clearTimers();
      active = false;
      if (!full) return;
      try {
        if (stream) stream.getTracks().forEach(t => t.stop());
      } catch (e) {}
      stream = null;
      try { video.pause(); } catch (e) {}
      try { video.srcObject = null; } catch (e) {}
    }

    function ensureAudioCtx() {
      if (audioCtx) return audioCtx;
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      try { audioCtx = new Ctx(); } catch (e) { audioCtx = null; }
      return audioCtx;
    }

    async function unlockAudio() {
      const ctx = ensureAudioCtx();
      if (!ctx) return false;
      try {
        if (ctx.state !== 'running') await ctx.resume();
      } catch (e) {}

      try {
        okAudio.muted = true;
        errAudio.muted = true;
        okAudio.currentTime = 0;
        errAudio.currentTime = 0;
        await Promise.allSettled([okAudio.play(), errAudio.play()]);
        okAudio.pause(); errAudio.pause();
        okAudio.currentTime = 0; errAudio.currentTime = 0;
      } catch (e) {}

      okAudio.muted = false;
      errAudio.muted = false;
      okAudio.volume = 1;
      errAudio.volume = 1;
      audioUnlocked = !!ctx && ctx.state === 'running';
      if (audioUnlocked) unlockBox.classList.remove('show');
      return audioUnlocked;
    }

    function showUnlockHint() {
      if (audioUnlocked || audioWarned) return;
      audioWarned = true;
      unlockBox.classList.add('show');
    }

    function vibrate(kind) {
      try {
        if (tg && tg.HapticFeedback) {
          if (kind === 'ok') tg.HapticFeedback.notificationOccurred('success');
          else tg.HapticFeedback.notificationOccurred('error');
        }
      } catch (e) {}
      try {
        if (navigator.vibrate) navigator.vibrate(kind === 'ok' ? [120, 50, 120] : [220, 80, 220]);
      } catch (e) {}
    }

    function webAudioBeep(kind) {
      const ctx = ensureAudioCtx();
      if (!ctx || ctx.state !== 'running') {
        showUnlockHint();
        return;
      }
      try {
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(kind === 'ok' ? 880 : 220, now);
        if (kind === 'error') osc.frequency.linearRampToValueAtTime(150, now + 0.18);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.18, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + (kind === 'ok' ? 0.18 : 0.30));
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + (kind === 'ok' ? 0.20 : 0.32));
      } catch (e) {}
    }

    async function playAudio(el, kind) {
      vibrate(kind);
      try {
        await unlockAudio();
        el.pause();
        el.currentTime = 0;
        el.muted = false;
        el.volume = 1;
        const p = el.play();
        if (p && typeof p.catch === 'function') {
          p.catch(() => webAudioBeep(kind));
        }
      } catch (e) {
        webAudioBeep(kind);
      }
    }

    function playOk() { playAudio(okAudio, 'ok'); }
    function playErr() { playAudio(errAudio, 'error'); }

    function hideResult() {
      resultEl.className = 'result';
      resultTextEl.textContent = '';
      resultSubEl.textContent = '';
      retryBtn.style.display = 'none';
    }

    function showResult(kind, text, sub = '', options = {}) {
      const autoClose = options.autoClose !== false;
      const allowRetry = options.allowRetry === true;
      active = false;
      busy = false;
      clearTimers();

      resultEl.className = `result show ${kind === 'ok' ? 'ok' : 'error'}`;
      resultIconEl.textContent = kind === 'ok' ? '✓' : '✕';
      resultTextEl.textContent = text;
      resultSubEl.textContent = sub || '';
      retryBtn.style.display = allowRetry ? 'inline-block' : 'none';

      if (kind === 'ok') playOk(); else playErr();

      if (autoClose) {
        setTimeout(() => {
          try {
            closing = true;
            if (tg) tg.close(); else window.close();
          } catch (e) {}
        }, 2500);
      }
    }

    function normalizeCode(raw) {
      let code = String(raw || '').trim();
      try {
        const u = new URL(code);
        code = u.searchParams.get('code') || u.searchParams.get('talon') || u.searchParams.get('id') || code;
      } catch (e) {}
      const m = code.match(/(\d{6,})/);
      return m ? m[1] : code;
    }

    function fmtDate(s) {
      if (!s) return '—';
      const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
      return m ? `${m[3]}.${m[2]}.${m[1]}` : s;
    }

    function displayTalonNumber(data, fallbackCode = '') {
      const value = (data && (data.talon_number || data.code || data.serial)) || fallbackCode || '';
      const digits = String(value).replace(/\D+/g, '');
      if (!digits) return String(value || fallbackCode || '—');
      return digits.match(/.{1,3}/g).join(' ');
    }

    async function submitCode(rawCode) {
      const code = normalizeCode(rawCode);
      if (!code) return;

      busy = true;
      hideResult();
      setStatus('⏳ Проверяю талон...');

      try {
        const res = await fetch('/tg/api/scan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: TOKEN, code, initData: INIT_DATA })
        });

        const data = await res.json().catch(() => ({ ok: false, error: 'bad_json' }));

        if (res.ok && data.ok) {
          const sub = (data.used_at_text || '') + (data.agzs ? '\nАГЗС: ' + data.agzs : '');
          showResult('ok', `Талон ${displayTalonNumber(data, code)} принят`, sub);
          return;
        }
        if (data.error === 'already_used') {
          const sub = (data.used_at_text || '') + (data.agzs ? '\nАГЗС: ' + data.agzs : '');
          showResult('error', `Талон ${displayTalonNumber(data, code)} уже использован`, sub);
          return;
        }
        if (data.error === 'expired') {
          showResult('error', 'Срок действия талона истёк', `Срок действия: ${fmtDate(data.valid_from)} — ${fmtDate(data.valid_to)}`);
          return;
        }
        if (data.error === 'talon_not_found') {
          showResult('error', `Талон ${code} не найден`);
          return;
        }
        if (data.error === 'token_expired' || data.error === 'not_logged_in') {
          showResult('error', 'Сессия истекла', 'Нажмите сканировать заново в Telegram', { autoClose: false, allowRetry: true });
          return;
        }
        showResult('error', 'Ошибка проверки талона', 'Попробуйте отсканировать ещё раз', { autoClose: false, allowRetry: true });
      } catch (e) {
        showResult('error', 'Ошибка сети', 'Попробуйте ещё раз', { autoClose: false, allowRetry: true });
      }
    }

    function scheduleScan(delay = 160) {
      if (scanTimer) clearTimeout(scanTimer);
      if (!active || busy || !pageVisible || !stream) return;
      scanTimer = setTimeout(scanOnce, delay);
    }

    function detectWithJsQR() {
      if (!video.videoWidth || !video.videoHeight || !window.jsQR) return null;
      const side = Math.min(video.videoWidth, video.videoHeight, 900);
      if (!side || side < 120) return null;

      canvas.width = side;
      canvas.height = side;
      const sx = Math.max(0, (video.videoWidth - side) / 2);
      const sy = Math.max(0, (video.videoHeight - side) / 2);
      ctx.drawImage(video, sx, sy, side, side, 0, 0, side, side);
      const imageData = ctx.getImageData(0, 0, side, side);
      const code = window.jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'attemptBoth' });
      return code && code.data ? code.data : null;
    }

    async function scanOnce() {
      if (!active || busy || !pageVisible || !stream || video.readyState < 2 || !video.videoWidth) {
        scheduleScan(220);
        return;
      }
      try {
        let raw = null;
        if (detector) {
          const codes = await detector.detect(video);
          if (codes && codes.length) raw = codes[0].rawValue || '';
        }
        if (!raw) raw = detectWithJsQR();
        if (raw) {
          const code = normalizeCode(raw);
          const now = Date.now();
          if (code && (code !== lastCode || now - lastAt > 2500)) {
            lastCode = code;
            lastAt = now;
            await submitCode(code);
            return;
          }
        }
      } catch (e) {}
      scheduleScan(IS_IOS ? 220 : 140);
    }

    function startWatchdog() {
      if (monitorTimer) clearInterval(monitorTimer);
      lastVideoTickAt = Date.now();
      lastVideoTime = video.currentTime || 0;
      monitorTimer = setInterval(async () => {
        if (!active || busy || !pageVisible || !stream) return;
        const tracks = stream.getVideoTracks();
        if (!tracks.length || tracks.some(t => t.readyState !== 'live')) {
          showResult('error', 'Камера остановилась', 'Нажмите «Повторить»', { autoClose: false, allowRetry: true });
          return;
        }
        const currentTime = video.currentTime || 0;
        if (currentTime > lastVideoTime + 0.001) {
          lastVideoTime = currentTime;
          lastVideoTickAt = Date.now();
        }
        if (Date.now() - lastVideoTickAt > 10000) {
          showResult('error', 'Видео с камеры зависло', 'Нажмите «Повторить»', { autoClose: false, allowRetry: true });
        }
      }, 2000);
    }

    async function waitForVideoReady(timeoutMs = 8000) {
      const startedAt = Date.now();
      while (Date.now() - startedAt < timeoutMs) {
        if (video.readyState >= 2 && video.videoWidth > 0 && video.videoHeight > 0) return true;
        await new Promise(r => setTimeout(r, 120));
      }
      return false;
    }

    async function startCamera(forceNew = false) {
      if (cameraStartPromise) return cameraStartPromise;
      cameraStartPromise = (async () => {
        hideResult();
        setStatus('📷 Наведите камеру на QR талона');

        try {
          if (forceNew) stopStream(true);

          if (!stream) {
            const constraints = {
              audio: false,
              video: {
                facingMode: { ideal: 'environment' },
                width: { ideal: 1280 },
                height: { ideal: 720 }
              }
            };
            stream = await navigator.mediaDevices.getUserMedia(constraints);
          }

          if (!video.srcObject) video.srcObject = stream;
          video.muted = true;
          video.setAttribute('playsinline', 'true');
          video.setAttribute('webkit-playsinline', 'true');
          try {
            const p = video.play();
            if (p && typeof p.then === 'function') await p.catch(() => {});
          } catch (e) {}

          const ready = await waitForVideoReady(IS_IOS ? 10000 : 7000);
          if (!ready) throw new Error('video_not_ready');

          if ('BarcodeDetector' in window) {
            try { detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { detector = null; }
          } else {
            detector = null;
          }

          active = true;
          busy = false;
          startWatchdog();
          scheduleScan(250);
        } catch (e) {
          active = false;
          showResult('error', 'Нет доступа к камере', 'Разрешите доступ к камере и нажмите «Повторить»', { autoClose: false, allowRetry: true });
        } finally {
          cameraStartPromise = null;
        }
      })();
      return cameraStartPromise;
    }

    retryBtn.addEventListener('click', async () => {
      busy = false;
      active = false;
      await startCamera(true);
    });

    unlockBtn.addEventListener('click', async () => {
      await unlockAudio();
      if (audioUnlocked) {
        webAudioBeep('ok');
        unlockBox.classList.remove('show');
      }
    });

    ['touchstart', 'pointerdown', 'click'].forEach(evt => {
      document.addEventListener(evt, () => { unlockAudio(); }, { passive: true });
    });

    document.addEventListener('visibilitychange', async () => {
      pageVisible = document.visibilityState === 'visible';
      if (closing) return;
      if (pageVisible) {
        if (stream) {
          active = true;
          try {
            const p = video.play();
            if (p && typeof p.then === 'function') await p.catch(() => {});
          } catch (e) {}
          startWatchdog();
          scheduleScan(180);
        } else {
          await startCamera(false);
        }
      } else {
        clearTimers();
        active = false;
      }
    });

    window.addEventListener('pagehide', () => {
      if (!closing) stopStream(true);
    });

    window.addEventListener('beforeunload', () => {
      stopStream(true);
    });

    window.addEventListener('load', async () => {
      await unlockAudio().catch(() => {});
      await startCamera(false);
    }, { once: true });
  </script>
</body>
</html>
