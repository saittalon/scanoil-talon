<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — MurAz CRM</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0b1736, #132a5e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 18px;
      padding: 32px 28px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.25);
    }

    .title {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      color: #132a5e;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #374151;
      font-weight: 600;
    }

    .login-box input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
      background: #ffffff !important;
      color: #111111 !important;
      -webkit-text-fill-color: #111111 !important;
      caret-color: #111111 !important;
      box-shadow: none !important;
    }

    .login-box input::placeholder {
      color: #888888 !important;
      -webkit-text-fill-color: #888888 !important;
    }

    .login-box input:focus {
      border-color: #4f7cff;
      box-shadow: 0 0 0 3px rgba(79, 124, 255, 0.15) !important;
      background: #ffffff !important;
      color: #111111 !important;
      -webkit-text-fill-color: #111111 !important;
    }

    .login-box input:-webkit-autofill,
    .login-box input:-webkit-autofill:hover,
    .login-box input:-webkit-autofill:focus,
    .login-box input:-webkit-autofill:active {
      -webkit-text-fill-color: #111111 !important;
      caret-color: #111111 !important;
      -webkit-box-shadow: 0 0 0 1000px #ffffff inset !important;
      box-shadow: 0 0 0 1000px #ffffff inset !important;
      transition: background-color 9999s ease-in-out 0s;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(90deg, #4f7cff, #6a8dff);
      color: white;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 8px;
    }

    button:hover {
      opacity: 0.95;
    }

    .alert {
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 14px;
    }

    .alert-danger {
      background: #fee2e2;
      color: #991b1b;
    }

    .alert-success {
      background: #dcfce7;
      color: #166534;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="title">MurAz CRM</div>
    <div class="subtitle">Вход в систему</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ 'danger' if category == 'error' else category }}">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="post" action="{{ url_for('auth.login_post') }}">
      <div class="form-group">
        <label for="username">Логин</label>
        <input type="text" id="username" name="username" required autocomplete="username" autofocus>
      </div>

      <div class="form-group">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>

      <button type="submit">Войти</button>
    </form>
  </div>
</body>
</html>
