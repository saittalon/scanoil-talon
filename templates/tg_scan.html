<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Сканер талонов</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#fff}
    body{position:fixed;inset:0}
    #app{position:relative;width:100vw;height:100vh;background:#000;overflow:hidden}
    #video,#reader{position:absolute;inset:0;width:100%;height:100%;background:#000}
    #video{object-fit:cover;display:block}
    #reader video{object-fit:cover !important}
    #reader__scan_region,#reader img{display:none !important}
    .overlay{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center}
    .scan-box{width:min(72vw,72vh);height:min(72vw,72vh);border:4px solid rgba(255,255,255,.96);border-radius:28px;box-shadow:0 0 0 9999px rgba(0,0,0,.42), 0 0 0 1px rgba(255,255,255,.15) inset;transition:border-color .18s ease, box-shadow .18s ease, transform .18s ease}
    .hud{position:absolute;left:14px;right:14px;top:max(14px, env(safe-area-inset-top));display:flex;justify-content:center;pointer-events:none;z-index:3}
    .status{max-width:min(680px,96vw);padding:12px 16px;border-radius:18px;background:rgba(8,12,18,.68);backdrop-filter:blur(8px);font-size:16px;font-weight:700;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.12)}
    .status.ok{background:rgba(24,112,54,.75);border-color:rgba(129,255,172,.25)}
    .status.error{background:rgba(120,20,20,.78);border-color:rgba(255,170,170,.25)}
    .status.scan{background:rgba(8,12,18,.68)}
    .flash-result{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:6;opacity:0;pointer-events:none;transition:opacity .16s ease}
    .flash-result.show{opacity:1}
    .flash-result.ok{background:rgba(14,148,62,.90)}
    .flash-result.error{background:rgba(186,32,32,.92)}
    .flash-icon{font-size:min(45vw,260px);line-height:1;color:#fff;text-shadow:0 12px 40px rgba(0,0,0,.35);transform:scale(.72);transition:transform .16s ease}
    .flash-result.show .flash-icon{transform:scale(1)}
    .hint{position:absolute;left:14px;right:14px;bottom:max(18px, calc(env(safe-area-inset-bottom) + 10px));display:flex;justify-content:center;pointer-events:none;z-index:3}
    .hint-box{padding:10px 14px;border-radius:16px;background:rgba(8,12,18,.62);backdrop-filter:blur(8px);font-size:14px;text-align:center;border:1px solid rgba(255,255,255,.1)}
    .hidden{display:none !important}
  </style>
</head>
<body>
  <div id="app">
    <video id="video" playsinline muted autoplay></video>
    <div id="reader" class="hidden"></div>

    <div class="overlay"><div id="scanBox" class="scan-box"></div></div>

    <div class="hud">
      <div id="status" class="status scan">Открываю камеру…</div>
    </div>

    <div class="hint">
      <div class="hint-box">Наведите камеру на QR-код талона</div>
    </div>

    <div id="flashResult" class="flash-result">
      <div id="flashIcon" class="flash-icon"></div>
    </div>
  </div>

  <audio id="scanSound" preload="auto" playsinline>
    <source src="/static/scan.wav" type="audio/wav">
  </audio>
  <audio id="errorSound" preload="auto" playsinline>
    <source src="/static/error.wav" type="audio/wav">
  </audio>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/html5-qrcode/html5-qrcode.min.js"></script>
  <script>
  const TOKEN = {{ token|tojson }};
  const TG = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  const INIT_DATA = TG && TG.initData ? TG.initData : "";
  const statusEl = document.getElementById('status');
  const video = document.getElementById('video');
  const reader = document.getElementById('reader');
  const scanSound = document.getElementById('scanSound');
  const errorSound = document.getElementById('errorSound');
  const scanBox = document.getElementById('scanBox');
  const flashResultEl = document.getElementById('flashResult');
  const flashIconEl = document.getElementById('flashIcon');

  let soundUnlocked = false;
  let stream = null;
  let detector = null;
  let scanning = false;
  let inFlight = false;
  let html5Scanner = null;
  let fallbackMode = false;
  const seen = new Map();

  if (TG) {
    try {
      TG.ready();
      TG.expand();
      TG.disableVerticalSwipes && TG.disableVerticalSwipes();
      TG.BackButton && TG.BackButton.hide();
    } catch (e) {}
  }

  async function unlockSound(){
    if(soundUnlocked) return;
    try{
      for(const el of [scanSound, errorSound]){
        if(!el) continue;
        el.muted = true; el.volume = 0;
        await el.play();
        el.pause(); el.currentTime = 0;
        el.muted = false; el.volume = 1.0;
      }
      soundUnlocked = true;
    }catch(e){ console.log('unlock failed', e); }
  }

  function setStatus(text, mode='scan'){
    statusEl.textContent = text;
    statusEl.className = 'status ' + (mode || 'scan');
  }

  function flashBox(kind){
    if(kind === 'ok'){
      scanBox.style.borderColor = '#38d96b';
      scanBox.style.boxShadow = '0 0 0 9999px rgba(22,145,67,.22), 0 0 0 1px rgba(134,255,186,.24) inset';
      scanBox.style.transform = 'scale(1.02)';
      setTimeout(resetBox, 260);
      return;
    }
    scanBox.style.borderColor = '#ff6666';
    scanBox.style.boxShadow = '0 0 0 9999px rgba(186,32,32,.18), 0 0 0 1px rgba(255,182,182,.20) inset';
    scanBox.style.transform = 'scale(1.02)';
    setTimeout(resetBox, 360);
  }

  function resetBox(){
    scanBox.style.borderColor = 'rgba(255,255,255,.96)';
    scanBox.style.boxShadow = '0 0 0 9999px rgba(0,0,0,.42), 0 0 0 1px rgba(255,255,255,.15) inset';
    scanBox.style.transform = 'scale(1)';
  }

  function flashResult(type){
    flashResultEl.classList.remove('ok', 'error');
    flashResultEl.classList.add(type === 'ok' ? 'ok' : 'error');
    flashIconEl.textContent = type === 'ok' ? '✓' : '✕';
    flashResultEl.classList.add('show');
    setTimeout(() => flashResultEl.classList.remove('show'), 900);
  }

  async function playSuccessFeedback(){
    try{ if(scanSound){ scanSound.pause(); scanSound.currentTime = 0; await scanSound.play(); } }catch(e){}
    try{ if(TG && TG.HapticFeedback){ TG.HapticFeedback.notificationOccurred('success'); } }catch(e){}
    flashBox('ok');
    flashResult('ok');
  }

  async function playErrorFeedback(){
    try{ if(errorSound){ errorSound.pause(); errorSound.currentTime = 0; await errorSound.play(); } }catch(e){}
    try{ navigator.vibrate && navigator.vibrate([80,60,80]); }catch(e){}
    try{ if(TG && TG.HapticFeedback){ TG.HapticFeedback.notificationOccurred('error'); } }catch(e){}
    flashBox('error');
    flashResult('error');
  }

  function cleanupSeen(){
    const now = Date.now();
    for(const [k, ts] of seen.entries()) if(now - ts > 15000) seen.delete(k);
  }

  function normalizeCode(raw){
    let code = String(raw || '').trim();
    try{
      const url = new URL(code);
      const qp = url.searchParams.get('code') || url.searchParams.get('talon') || url.searchParams.get('id');
      if(qp) code = qp;
    }catch(e){}
    const m = code.match(/(\d{6,})/);
    if(m) code = m[1];
    return code;
  }

  async function stopCamera(){
    scanning = false;
    detector = null;
    inFlight = false;
    fallbackMode = false;
    try{ if(html5Scanner){ await html5Scanner.stop(); await html5Scanner.clear(); html5Scanner = null; } }catch(e){ console.log(e); }
    try{ if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; } }catch(e){}
    try{ video.srcObject = null; }catch(e){}
  }

  function sendResultToTelegram(payload){
    if(!TG || !TG.sendData) return;
    try{ TG.sendData(JSON.stringify(payload)); }catch(e){ console.log('sendData failed', e); }
  }

  async function finishAndClose(payload, ok){
    sendResultToTelegram(payload);
    await new Promise(resolve => setTimeout(resolve, ok ? 1100 : 1300));
    try{ await stopCamera(); }catch(e){}
    try{ if(TG){ TG.close(); } }catch(e){}
  }

  async function submitCode(rawCode){
    const code = normalizeCode(rawCode);
    if(!code){
      setStatus('Код не распознан.', 'error');
      await playErrorFeedback();
      await finishAndClose({type:'scan_result', status:'error', code:'', message:'Код не распознан'}, false);
      return;
    }

    try{
      const res = await fetch('/tg/api/scan', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({token: TOKEN, code, initData: INIT_DATA})
      });

      const data = await res.json().catch(()=>({ok:false,error:'bad_json'}));

      if(res.ok && data.ok){
        setStatus('Талон принят.', 'ok');
        await playSuccessFeedback();
        await finishAndClose({
          type:'scan_result',
          status:'accepted',
          code,
          serial:data.serial || code,
          liters:data.liters,
          product:data.product,
          agzs:data.agzs,
          used_at:data.used_at,
          valid_to:data.valid_to
        }, true);
        return;
      }

      let payload = {type:'scan_result', status:'error', code, message:'Ошибка обработки'};
      if(data.error === 'already_used'){
        setStatus('Талон уже использован.', 'error');
        payload = {type:'scan_result', status:'already_used', code, agzs:data.agzs, used_at:data.used_at};
      } else if(data.error === 'talon_not_found'){
        setStatus('Талон не найден.', 'error');
        payload = {type:'scan_result', status:'not_found', code};
      } else if(data.error === 'expired'){
        setStatus('Срок действия талона истёк.', 'error');
        payload = {type:'scan_result', status:'expired', code, valid_to:data.valid_to};
      } else if(data.error === 'token_expired' || data.error === 'not_logged_in'){
        setStatus('Сессия истекла. Откройте сканер заново.', 'error');
        payload = {type:'scan_result', status:'session_expired', code, message:'Сессия истекла'};
      } else if(data.error === 'invalid_telegram_context'){
        setStatus('Недействительная Telegram-сессия.', 'error');
        payload = {type:'scan_result', status:'invalid_telegram_context', code, message:'Недействительная Telegram-сессия'};
      } else if(data.error === 'missing_token_or_code'){
        setStatus('Пустой код.', 'error');
        payload = {type:'scan_result', status:'error', code, message:'Пустой код'};
      } else {
        setStatus('Ошибка при обработке талона.', 'error');
      }

      await playErrorFeedback();
      await finishAndClose(payload, false);
    } catch(e){
      console.error(e);
      setStatus('Ошибка сети.', 'error');
      await playErrorFeedback();
      await finishAndClose({type:'scan_result', status:'network_error', code, message:'Ошибка сети'}, false);
    }
  }

  async function handleDetected(raw){
    const code = normalizeCode(raw);
    if(!code || inFlight) return;
    const now = Date.now();
    const last = seen.get(code);
    if(last && (now - last) <= 2500) return;
    seen.set(code, now);
    inFlight = true;
    setStatus('Проверяю талон…');
    await submitCode(code);
    inFlight = false;
  }

  async function scanLoop(){
    if(!scanning || fallbackMode || !detector) return;
    cleanupSeen();
    if(!inFlight){
      try{
        const codes = await detector.detect(video);
        if(codes && codes.length){
          await handleDetected((codes[0].rawValue || '').trim());
          return;
        }
      } catch(e){ console.log(e); }
    }
    requestAnimationFrame(scanLoop);
  }

  async function startBarcodeDetectorMode(){
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio:false
    });
    video.classList.remove('hidden');
    reader.classList.add('hidden');
    video.srcObject = stream;
    await video.play();
    detector = new BarcodeDetector({formats:['qr_code']});
    fallbackMode = false;
    scanning = true;
    setStatus('Наведите камеру на QR-код');
    scanLoop();
  }

  async function startHtml5QrcodeFallback(){
    fallbackMode = true;
    video.classList.add('hidden');
    reader.classList.remove('hidden');
    html5Scanner = new Html5Qrcode('reader');
    await html5Scanner.start(
      { facingMode: 'environment' },
      { fps: 12, qrbox: (vw, vh) => { const side = Math.floor(Math.min(vw, vh) * 0.72); return { width: side, height: side }; } },
      async (decodedText) => { await handleDetected(decodedText); },
      () => {}
    );
    scanning = true;
    setStatus('Наведите камеру на QR-код');
  }

  async function startCamera(){
    try{
      await unlockSound();
      setStatus('Открываю камеру…');
      if('BarcodeDetector' in window){
        try{ await startBarcodeDetectorMode(); return; }catch(e){ console.log('BarcodeDetector failed', e); }
      }
      if(window.Html5Qrcode){ await startHtml5QrcodeFallback(); return; }
      throw new Error('scanner_not_supported');
    }catch(e){
      console.error(e);
      setStatus('Не удалось открыть камеру. Разрешите доступ и попробуйте снова.', 'error');
      await playErrorFeedback();
      await finishAndClose({type:'scan_result', status:'camera_error', message:'Не удалось открыть камеру'}, false);
    }
  }

  document.addEventListener('DOMContentLoaded', async () => { await startCamera(); });
  </script>
</body>
</html>
