{% extends "base.html" %}
{% block content %}
{% include "_client_header.html" %}

<div class="card card-soft section-card">
  <div class="page-hero mb-4">
    <div class="hero-title">Новый договор</div>
  </div>

  <form method="post" action="{{ url_for('clients.contract_new_post', client_id=client.id) }}">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Договор *</label>
        <input class="form-control" name="number" placeholder="Номер договора" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">Дата от *</label>
        <input class="form-control" type="date" name="date_from" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">Дата до</label>
        <input class="form-control" type="date" name="date_to">
      </div>

      <div class="col-md-6">
        <label class="form-label">Цена (тг/л) *</label>
        <input class="form-control" type="number" step="0.01" min="0" name="price_per_liter" placeholder="Цена" required>
      </div>
      <div class="col-md-6 d-flex align-items-end">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" name="online" id="online">
          <label class="form-check-label" for="online">Online-режим</label>
        </div>
      </div>

      <div class="col-md-6">
        <label class="form-label">Ограничение АЗС</label>
        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" name="allow_all_stations" id="allowAll" checked>
          <label class="form-check-label" for="allowAll">Разрешён на всех АЗС</label>
        </div>
        <input class="form-control" name="forbidden_groups" placeholder="Запрещённые группы АЗС">
      </div>

      <div class="col-12 d-flex gap-2 flex-wrap mt-2">
        <button class="btn btn-brand px-4" type="submit">Сохранить договор</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('clients.client_contracts', client_id=client.id) }}">Отменить</a>
      </div>
    </div>
  </form>
</div>
{% endblock %}
