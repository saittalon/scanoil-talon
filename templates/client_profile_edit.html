{% extends "base.html" %}
{% block content %}
{% include "_client_header.html" %}
<div class="card card-soft section-card">
  <div class="section-title mb-3">Редактирование профиля клиента</div>
  <form method="post" action="{{ url_for('clients.client_profile_edit_post', client_id=client.id) }}">
    <div class="row g-3">
      <div class="col-md-8">
        <label class="form-label">Название в системе *</label>
        <input class="form-control" name="name" value="{{ client.name }}" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Категория</label>
        <select class="form-select" name="category">
          <option value="counterparty" {{ 'selected' if client.category == 'counterparty' else '' }}>Контрагент</option>
          <option value="employee" {{ 'selected' if client.category == 'employee' else '' }}>Сотрудник</option>
        </select>
      </div>
      <div class="col-md-12"><label class="form-label">Полное название</label><input class="form-control" name="full_name" value="{{ client.full_name or '' }}"></div>
      <div class="col-md-3"><label class="form-label">БИН</label><input class="form-control" name="bin" value="{{ client.bin or '' }}"></div>
      <div class="col-md-3"><label class="form-label">КПП</label><input class="form-control" name="kpp" value="{{ client.kpp or '' }}"></div>
      <div class="col-md-3"><label class="form-label">ОГРН</label><input class="form-control" name="ogrn" value="{{ client.ogrn or '' }}"></div>
      <div class="col-md-3"><label class="form-label">ОКПО</label><input class="form-control" name="okpo" value="{{ client.okpo or '' }}"></div>
      <div class="col-12"><label class="form-label">Юридический адрес</label><input class="form-control" name="legal_address" value="{{ client.legal_address or '' }}"></div>
      <div class="col-12"><label class="form-label">Фактический адрес</label><input class="form-control" name="fact_address" value="{{ client.fact_address or '' }}"></div>
      <div class="col-12"><label class="form-label">Почтовый адрес</label><input class="form-control" name="post_address" value="{{ client.post_address or '' }}"></div>
      <div class="col-md-6"><label class="form-label">Телефон</label><input class="form-control" name="phone" value="{{ client.phone or '' }}"></div>
      <div class="col-md-6"><label class="form-label">E-mail</label><input class="form-control" name="email" value="{{ client.email or '' }}"></div>
      <div class="col-12"><label class="form-label">Комментарий</label><textarea class="form-control" name="comment" rows="4">{{ client.comment or '' }}</textarea></div>
      <div class="col-12 d-flex gap-2 flex-wrap">
        <button class="btn btn-brand">Сохранить изменения</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('clients.client_profile', client_id=client.id) }}">Отмена</a>
      </div>
    </div>
  </form>
</div>
{% endblock %}
